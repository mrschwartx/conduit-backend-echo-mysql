services:
  conduit-mysql:
    image: mysql:8.4
    container_name: conduit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_pass
      MYSQL_DATABASE: conduit_dev
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_pass
    ports:
      - "3306:3306"
    volumes:
      - conduit-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  conduit-phpmyadmin:
    image: phpmyadmin:5
    container_name: conduit-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: conduit-mysql
    ports:
      - "8081:80"
    depends_on:
      conduit-mysql:
        condition: service_healthy

volumes:
  conduit-mysql-data:
