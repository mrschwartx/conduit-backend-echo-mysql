services:
  conduit-mysql:
    image: mysql:8.4
    container_name: conduit-mysql
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-conduit}
      MYSQL_USER: ${DB_USER:-conduit}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, run make docker/env}
    volumes:
      - conduit-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  conduit-backend:
    build:
      context: ../conduit-backend
      dockerfile: ../conduit-docker/conduit-backend-echo/Dockerfile
    image: conduit-backend-echo:local
    container_name: conduit-backend
    restart: unless-stopped
    environment:
      APP_LEVEL: ${APP_LEVEL:-development}
      DATABASE_URL: mysql://${DB_USER:-conduit}:${DB_PASSWORD}@conduit-mysql:3306/${DB_NAME:-conduit}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required, run make docker/env}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      conduit-mysql:
        condition: service_healthy

volumes:
  conduit-mysql-data:
